<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threads 收藏簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="收藏簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column like a notebook page. Capture box on top, filter strip, then cards.
   The only loud colour is the highlighter-pen yellow on keywords. */
:root{
  --bg:#f2f4f0; --surface:#ffffff; --ink:#1b2220; --muted:#657069; --line:#dce1da;
  --accent:#1c6b58; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --marker:#ffe45c; --marker-ink:#1b2220; --danger:#b3372f;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131716; --surface:#1c2220; --ink:#e7ebe8; --muted:#96a19b; --line:#2d3532;
    --accent:#74d1b6; --accent-ink:#0f1a17; --accent-soft:#213430;
    --marker:#f0d24a; --marker-ink:#17150a; --danger:#f08a80;
    color-scheme:dark;
  }
  h1 span{background:none !important;color:var(--marker)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 2px}
.status{font-size:12px;color:var(--muted)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea,input[type=text],input[type=search],input[type=url]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:72px;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:8px 22px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px;min-height:40px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
#capture{display:flex;flex-direction:column;gap:8px}

.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px}

.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:14px;white-space:nowrap;min-height:36px}
.chip b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] b{color:inherit;opacity:.8}
.chip.dashed{border-style:dashed;color:var(--muted)}

#list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.pinned{border-left:4px solid var(--marker)}
.card.demo{border-style:dashed}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.meta .who{font-weight:700;color:var(--ink);font-size:13px;overflow-wrap:anywhere}
.body{white-space:pre-wrap;overflow-wrap:anywhere}
.body.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7;overflow:hidden}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;overflow-wrap:anywhere}
mark.hl{background:var(--marker);color:var(--marker-ink);border-radius:3px;padding:0 2px;cursor:pointer}
mark.sr{background:var(--accent-soft);color:inherit;border-bottom:2px solid var(--accent);border-radius:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:6px;padding:4px 10px;min-height:30px}
.tag.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.kw{background:var(--marker);color:var(--marker-ink);border:0;border-radius:6px;padding:4px 10px;font-size:13px;min-height:30px}
.imgs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.imgs::-webkit-scrollbar{display:none}
.thumb{flex:none;position:relative;border:1px solid var(--line);border-radius:8px;padding:0;background:var(--bg);overflow:hidden;height:120px}
.thumb img{display:block;height:100%;width:auto;max-width:220px;object-fit:cover}
.thumb.small{height:72px}
.thumb .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.actions{display:flex;gap:2px;flex-wrap:wrap;margin:0 -8px -4px}
.actions a{color:var(--accent);text-decoration:none;font-weight:500;padding:6px 8px;display:inline-flex;align-items:center;min-height:40px}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
ol.how{margin:0;padding-left:20px;color:var(--muted);font-size:14px}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92%;margin:auto auto 0;border-radius:16px 16px 0 0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:17px;margin:0}
.sheet label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.inline{display:flex;gap:6px}
.inline input{flex:1;min-width:0}
.catrow{display:flex;gap:6px;align-items:center}
.catrow input{flex:1;min-width:0}
#viewDlg{max-width:100%;width:100%;height:100%;max-height:100%;margin:0;border-radius:0;background:#000}
#viewDlg div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
#viewDlg img{max-width:100%;max-height:100%}

#selbar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;justify-content:center;padding:0 16px;z-index:5}
#selbar button{background:var(--marker);color:var(--marker-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:99}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Threads 收藏簿</span></h1>
    <div class="row"><button class="btn primary" type="button" id="installBtn" hidden>安裝 app</button><div class="status" id="status">開緊…</div></div>
  </header>

  <section class="box" id="capture">
    <textarea id="quick" placeholder="貼上 Threads 連結、post 內容，或者兩樣一齊貼" aria-label="貼上連結或內容"></textarea>
    <div class="imgs" id="quickImgs" hidden></div>
    <div class="row between">
      <div class="row">
        <button class="btn" type="button" id="quickPaste">貼上</button>
        <button class="btn" type="button" id="quickImg">＋ 圖片</button>
      </div>
      <div class="row">
        <button class="btn" type="button" id="quickMore">加分類</button>
        <button class="btn primary" type="button" id="quickSave">儲存</button>
      </div>
    </div>
  </section>

  <div class="tools">
    <input type="search" id="q" placeholder="搜尋內容、作者、分類、關鍵字" aria-label="搜尋">
    <select id="sort" aria-label="排序">
      <option value="new">最新</option>
      <option value="old">最舊</option>
    </select>
  </div>

  <nav class="strip" id="strip" aria-label="分類篩選"></nav>
  <div class="hint" id="count"></div>
  <main id="list"></main>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<dialog id="editDlg" aria-labelledby="editTitle">
  <div class="sheet">
    <h2 id="editTitle">編輯收藏</h2>
    <label>連結<input type="url" id="fUrl" placeholder="https://www.threads.com/@…" inputmode="url"></label>
    <label>內容<textarea id="fText" rows="5" placeholder="Post 內容"></textarea></label>
    <div>
      <div class="hint">圖片 / screenshot</div>
      <div class="imgs" id="fImgs"></div>
      <button class="btn" type="button" id="fAddImg" style="margin-top:6px">＋ 圖片</button>
    </div>
    <label>我嘅備註<input type="text" id="fNote" placeholder="點解要收藏？之後想點用？"></label>
    <div>
      <div class="hint">分類（可以揀多過一個）</div>
      <div class="picker" id="fCats"></div>
      <div class="inline" style="margin-top:6px">
        <input type="text" id="fNewCat" placeholder="新分類名" aria-label="新分類名">
        <button class="btn" type="button" id="fAddCat">加</button>
      </div>
    </div>
    <div>
      <div class="hint">Highlight 關鍵字（㩒一下可以移除）</div>
      <div class="picker" id="fKws"></div>
      <div class="inline" style="margin-top:6px">
        <input type="text" id="fNewKw" placeholder="關鍵字，可以用逗號分隔" aria-label="新關鍵字">
        <button class="btn" type="button" id="fAddKw">加</button>
      </div>
    </div>
    <div class="row between">
      <button class="btn ghost" type="button" id="fCancel">取消</button>
      <button class="btn primary" type="button" id="fSave">儲存</button>
    </div>
  </div>
</dialog>

<dialog id="catDlg" aria-labelledby="catTitle">
  <div class="sheet">
    <h2 id="catTitle">管理分類</h2>
    <div id="catList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="inline">
      <input type="text" id="cNew" placeholder="新分類名" aria-label="新分類名">
      <button class="btn" type="button" id="cAdd">加</button>
    </div>
    <div class="row between">
      <span class="hint">改名同刪除會套用到所有收藏。</span>
      <button class="btn primary" type="button" id="cDone">完成</button>
    </div>
  </div>
</dialog>

<dialog id="backupDlg" aria-labelledby="backupTitle">
  <div class="sheet">
    <h2 id="backupTitle">備份</h2>
    <div class="hint">所有收藏只儲存喺呢部機。清除瀏覽器資料、刪除主畫面圖示或者換機都會冇咗，所以間唔中匯出一個備份檔，放喺雲端或者傳畀自己。</div>
    <button class="btn wide" type="button" id="bExport">匯出備份檔</button>
    <button class="btn wide" type="button" id="bImport">由備份檔匯入</button>
    <div class="hint">匯入只會加返冇嘅收藏，唔會覆蓋而家有嘅。</div>
    <div class="row between"><span></span><button class="btn primary" type="button" id="bDone">完成</button></div>
  </div>
</dialog>

<dialog id="viewDlg" aria-label="睇大圖"><div><img id="viewImg" alt="收藏嘅圖片"></div></dialog>

<div id="selbar"><button type="button" id="selBtn"></button></div>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const state = { posts: [], metaCats: [], loaded: false, q: '', filter: 'all', sort: 'new', quickImgs: [] };
const expanded = new Set();
let idb = null, draft = null, pendingSel = null, toastTimer = 0, fileTarget = 'quick';

/* ---------- storage (IndexedDB on this device) ---------- */
function setStatus(t){ $('#status').textContent = t; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); }
function openDb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('threads-shelf', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('posts', { keyPath: 'id' }); r.result.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => rej(t.error);
  });
}
async function init(){
  try {
    idb = await openDb();
    state.posts = await tx('posts', 'readonly', s => s.getAll()) || [];
    state.metaCats = await tx('meta', 'readonly', s => s.get('cats')) || [];
    setStatus('儲存喺呢部機');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch(e){
    idb = null; setStatus('呢個瀏覽器唔俾儲存，關咗就會冇');
  }
  state.loaded = true; render();
}
async function savePost(p){
  const row = { id: p.id, url: p.url || '', author: p.author || '', text: p.text || '', note: p.note || '', cats: p.cats || [], kws: p.kws || [], imgs: p.imgs || [], pinned: !!p.pinned, created: p.created };
  try {
    if (idb) await tx('posts', 'readwrite', s => s.put(row));
    const i = state.posts.findIndex(x => x.id === row.id); if (i >= 0) state.posts[i] = row; else state.posts.push(row);
    render(); return true;
  } catch(e){ toast('儲存唔到，可能部機冇位。試下刪走啲圖片'); return false; }
}
async function removePost(id){
  try { if (idb) await tx('posts', 'readwrite', s => s.delete(id)); state.posts = state.posts.filter(x => x.id !== id); render(); }
  catch(e){ toast('刪除唔到，請再試一次'); }
}
async function saveCats(arr){
  try { if (idb) await tx('meta', 'readwrite', s => s.put(arr, 'cats')); state.metaCats = arr; render(); }
  catch(e){ toast('分類儲存唔到，請再試一次'); }
}
function allCats(){
  const out = state.metaCats.slice();
  for (const p of state.posts) for (const c of (p.cats || [])) if (!out.includes(c)) out.push(c);
  return out;
}

/* ---------- images ---------- */
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
async function addFiles(files, target){
  let bad = 0;
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try { const d = await shrink(f); if (target === 'draft' && draft) draft.imgs.push(d); else state.quickImgs.push(d); } catch(e){ bad++; }
  }
  if (bad) toast('有 ' + bad + ' 張圖開唔到，試下用 screenshot');
  if (target === 'draft') renderDraft(); else renderQuickImgs();
}
function thumbs(arr, removable, small){
  return arr.map((d, i) => '<span class="thumb' + (small ? ' small' : '') + '"><img src="' + d + '" alt="圖片 ' + (i + 1) + '" data-img="' + i + '">' + (removable ? '<button type="button" class="x" data-rm="' + i + '" aria-label="移除圖片">×</button>' : '') + '</span>').join('');
}
function renderQuickImgs(){ const el = $('#quickImgs'); el.hidden = !state.quickImgs.length; el.innerHTML = thumbs(state.quickImgs, true, true); }
$('#quickImgs').onclick = e => { const b = e.target.closest('[data-rm]'); if (b){ state.quickImgs.splice(+b.dataset.rm, 1); renderQuickImgs(); } };
$('#quickImg').onclick = () => { fileTarget = 'quick'; $('#file').click(); };
$('#fAddImg').onclick = () => { fileTarget = 'draft'; $('#file').click(); };
$('#file').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; await addFiles(fs, fileTarget); };
$('#quick').addEventListener('paste', e => { const fs = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/')); if (fs.length){ e.preventDefault(); addFiles(fs, 'quick'); } });
function viewImg(src){ $('#viewImg').src = src; $('#viewDlg').showModal(); }
$('#viewDlg').onclick = () => $('#viewDlg').close();

/* ---------- parsing ---------- */
function parseInput(raw){
  const m = raw.match(/https?:\/\/[^\s]+/);
  let url = '', author = '', text = raw;
  if (m){
    url = m[0].replace(/[)\]。，,]+$/, '');
    text = raw.replace(m[0], '').trim();
    try { const u = new URL(url); if (/threads\.(net|com)$/.test(u.hostname)){ u.search = ''; u.hash = ''; url = u.toString(); const a = u.pathname.match(/\/@([\w.]+)/); if (a) author = '@' + a[1]; } } catch(e){}
  }
  return { url, author, text: text.trim() };
}
function newPost(raw){
  const p = parseInput(raw);
  return Object.assign(p, { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), note: '', cats: [], kws: [], imgs: [], pinned: false, created: Date.now() });
}

/* ---------- rendering ---------- */
function terms(){ return state.q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function markUp(text, kws, ts){
  const all = [...new Set([...kws, ...ts].filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!all.length) return esc(text);
  const re = new RegExp('(' + all.map(rx).join('|') + ')', 'gi');
  const kset = new Set(kws.map(k => k.toLowerCase()));
  return text.split(re).map((part, i) => i % 2
    ? (kset.has(part.toLowerCase()) ? '<mark class="hl" data-act="kw">' + esc(part) + '</mark>' : '<mark class="sr">' + esc(part) + '</mark>')
    : esc(part)).join('');
}
function fmtDate(t){ const d = new Date(t); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }

function visiblePosts(){
  const ts = terms();
  const rows = state.posts.filter(p => {
    if (state.filter === 'none' && (p.cats || []).length) return false;
    if (state.filter === 'pin' && !p.pinned) return false;
    if (state.filter.startsWith('c:') && !(p.cats || []).includes(state.filter.slice(2))) return false;
    if (!ts.length) return true;
    const hay = [p.text, p.note, p.author, p.url, (p.cats || []).join(' '), (p.kws || []).join(' ')].join(' ').toLowerCase();
    return ts.every(t => hay.includes(t));
  });
  rows.sort((a, b) => (b.pinned - a.pinned) || (state.sort === 'new' ? b.created - a.created : a.created - b.created));
  return rows;
}

function renderStrip(){
  const cats = allCats();
  const n = f => state.posts.filter(f).length;
  const chip = (key, label, count) => '<button type="button" class="chip" data-f="' + esc(key) + '" aria-pressed="' + (state.filter === key) + '">' + esc(label) + '<b>' + count + '</b></button>';
  let h = chip('all', '全部', state.posts.length) + chip('pin', '置頂', n(p => p.pinned)) + chip('none', '未分類', n(p => !(p.cats || []).length));
  for (const c of cats) h += chip('c:' + c, c, n(p => (p.cats || []).includes(c)));
  h += '<button type="button" class="chip dashed" id="manage">管理分類</button><button type="button" class="chip dashed" id="backup">備份</button>';
  $('#strip').innerHTML = h;
}

function cardHtml(p, ts, demo){
  const kws = p.kws || [], imgs = p.imgs || [];
  const long = (p.text || '').length > 260 && !ts.length && !expanded.has(p.id);
  let h = '<article class="card' + (p.pinned ? ' pinned' : '') + (demo ? ' demo' : '') + '" data-id="' + esc(p.id) + '">';
  h += '<div class="meta"><span class="who">' + (p.author ? markUp(p.author, [], ts) : (p.url ? '連結' : (imgs.length && !p.text ? '圖片' : '筆記'))) + (demo ? '　（示範，儲存第一個收藏之後就會消失）' : '') + '</span><span>' + fmtDate(p.created) + '</span></div>';
  if (p.text) h += '<div class="body' + (long ? ' clamp' : '') + '" data-body="1">' + markUp(p.text, kws, ts) + '</div>';
  else if (p.url && !imgs.length) h += '<div class="body hint">只儲存咗連結。㩒「編輯」貼返內容或者加 screenshot，之後先搵得返。</div>';
  if (long || expanded.has(p.id)) h += '<div><button type="button" class="btn ghost" data-act="more" style="margin-left:-8px">' + (long ? '展開全文' : '收起') + '</button></div>';
  if (imgs.length) h += '<div class="imgs" data-act="img">' + thumbs(imgs, false, false) + '</div>';
  if (p.note) h += '<div class="note">' + markUp(p.note, kws, ts) + '</div>';
  if (kws.length) h += '<div class="tags">' + kws.map(k => '<button type="button" class="kw" data-act="kw">' + esc(k) + '</button>').join('') + '</div>';
  h += '<div class="tags">' + (p.cats || []).map(c => '<button type="button" class="tag" data-act="cat" data-c="' + esc(c) + '">' + esc(c) + '</button>').join('') + (demo ? '' : '<button type="button" class="tag add" data-act="edit">＋ 分類</button>') + '</div>';
  if (!demo){
    h += '<div class="actions">';
    if (p.url) h += '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">開原文</a><button type="button" class="btn ghost" data-act="copy">複製連結</button>';
    h += '<button type="button" class="btn ghost" data-act="pin">' + (p.pinned ? '取消置頂' : '置頂') + '</button><button type="button" class="btn ghost" data-act="edit">編輯</button><button type="button" class="btn ghost danger" data-act="del">刪除</button></div>';
  }
  return h + '</article>';
}

function render(){
  renderStrip();
  const list = $('#list'), ts = terms();
  if (!state.loaded){ list.innerHTML = '<div class="empty">載入緊你嘅收藏…</div>'; $('#count').textContent = ''; return; }
  if (!state.posts.length){
    $('#count').textContent = '';
    list.innerHTML = '<div class="box"><ol class="how"><li>喺 Threads 㩒分享 → 複製連結，或者長按 post 複製文字。</li><li>返嚟㩒「貼上」，有圖就㩒「＋ 圖片」揀 screenshot，然後「儲存」。</li><li>之後隨時加分類；喺內文揀取文字就可以 highlight。</li></ol></div>'
      + cardHtml({ id: 'demo', author: '@example', url: '', text: '三個令你朝早唔使趕嘅習慣：前一晚執好袋、早餐預先切好、鬧鐘放喺房門口。', note: '想試下第三個', cats: ['生活'], kws: ['鬧鐘放喺房門口'], imgs: [], pinned: false, created: Date.now() }, [], true);
    return;
  }
  const rows = visiblePosts();
  $('#count').textContent = (ts.length || state.filter !== 'all') ? '搵到 ' + rows.length + ' 個，共 ' + state.posts.length + ' 個收藏' : '共 ' + state.posts.length + ' 個收藏';
  list.innerHTML = rows.length ? rows.map(p => cardHtml(p, ts, false)).join('') : '<div class="empty">冇符合嘅收藏。試下轉個關鍵字，或者㩒「全部」。</div>';
}

/* ---------- capture ---------- */
async function quickSave(openEdit){
  const raw = $('#quick').value.trim();
  if (!raw && !state.quickImgs.length){ toast('貼上連結、內容或者加張圖先'); return; }
  const p = newPost(raw); p.imgs = state.quickImgs.slice();
  if (p.url){ const dup = state.posts.find(x => x.url === p.url); if (dup){ toast('呢個連結收藏過喇'); state.q = ''; $('#q').value = ''; state.filter = 'all'; render(); const el = document.querySelector('[data-id="' + dup.id + '"]'); if (el) el.scrollIntoView({ block: 'center' }); return; } }
  const clear = () => { $('#quick').value = ''; state.quickImgs = []; renderQuickImgs(); };
  if (openEdit){ clear(); openEditor(p, true); return; }
  if (await savePost(p)){ clear(); toast((p.text || p.imgs.length) ? '儲存咗' : '儲存咗連結。加埋內容或者 screenshot 會易搵啲'); }
}
$('#quickSave').onclick = () => quickSave(false);
$('#quickMore').onclick = () => quickSave(true);
$('#quickPaste').onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (!t){ toast('剪貼簿冇文字'); return; }
    const q = $('#quick'); q.value = q.value ? q.value + '\n' + t : t;
  } catch(e){ toast('自動貼上唔得，請長按個格再揀「貼上」'); $('#quick').focus(); }
};

/* ---------- filters ---------- */
$('#q').oninput = e => { state.q = e.target.value; render(); };
$('#sort').onchange = e => { state.sort = e.target.value; render(); };
$('#strip').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'manage') return openCats();
  if (b.id === 'backup') return $('#backupDlg').showModal();
  state.filter = b.dataset.f; render();
};

/* ---------- card actions ---------- */
$('#list').onclick = async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const card = t.closest('.card'); const p = state.posts.find(x => x.id === card.dataset.id);
  const act = t.dataset.act;
  if (act === 'kw'){ state.q = t.textContent; $('#q').value = state.q; state.filter = 'all'; render(); window.scrollTo(0, 0); return; }
  if (!p) return;
  if (act === 'img'){ const im = e.target.closest('[data-img]'); if (im) viewImg(p.imgs[+im.dataset.img]); }
  else if (act === 'cat'){ state.filter = 'c:' + t.dataset.c; render(); window.scrollTo(0, 0); }
  else if (act === 'more'){ expanded.has(p.id) ? expanded.delete(p.id) : expanded.add(p.id); render(); }
  else if (act === 'edit') openEditor(p, false);
  else if (act === 'pin') savePost(Object.assign({}, p, { pinned: !p.pinned }));
  else if (act === 'copy'){ try { await navigator.clipboard.writeText(p.url); toast('複製咗連結'); } catch(err){ toast('複製唔到，請長按「開原文」複製'); } }
  else if (act === 'del'){
    if (t.dataset.sure){ removePost(p.id); }
    else { t.dataset.sure = '1'; t.textContent = '確定刪除？'; setTimeout(() => { if (t.isConnected){ delete t.dataset.sure; t.textContent = '刪除'; } }, 3000); }
  }
};

/* ---------- select text to highlight ---------- */
document.addEventListener('selectionchange', () => {
  const sel = document.getSelection(); const bar = $('#selbar');
  const txt = sel && !sel.isCollapsed ? sel.toString().trim() : '';
  const a = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const body = a && a.closest('[data-body]');
  const card = body && body.closest('.card:not(.demo)');
  if (txt && txt.length <= 40 && !/\n/.test(txt) && card && sel.focusNode && body.contains(sel.focusNode)){
    pendingSel = { id: card.dataset.id, text: txt };
    $('#selBtn').textContent = 'Highlight「' + txt + '」';
    bar.style.display = 'flex';
  } else { bar.style.display = 'none'; }
});
$('#selBtn').addEventListener('pointerdown', e => e.preventDefault());
$('#selBtn').onclick = async () => {
  if (!pendingSel) return;
  const p = state.posts.find(x => x.id === pendingSel.id); if (!p) return;
  const kws = (p.kws || []).slice();
  if (!kws.some(k => k.toLowerCase() === pendingSel.text.toLowerCase())) kws.push(pendingSel.text);
  document.getSelection().removeAllRanges(); $('#selbar').style.display = 'none';
  if (await savePost(Object.assign({}, p, { kws }))) toast('Highlight 咗');
};

/* ---------- editor ---------- */
function openEditor(p, isNew){
  draft = { id: p.id, url: p.url, author: p.author, text: p.text, note: p.note, cats: (p.cats || []).slice(), kws: (p.kws || []).slice(), imgs: (p.imgs || []).slice(), pinned: p.pinned, created: p.created };
  $('#editTitle').textContent = isNew ? '新增收藏' : '編輯收藏';
  $('#fUrl').value = draft.url || ''; $('#fText').value = draft.text || ''; $('#fNote').value = draft.note || '';
  $('#fNewCat').value = ''; $('#fNewKw').value = '';
  renderDraft();
  $('#editDlg').showModal();
}
function renderDraft(){
  const cats = allCats(); for (const c of draft.cats) if (!cats.includes(c)) cats.push(c);
  $('#fCats').innerHTML = cats.length ? cats.map(c => '<button type="button" class="chip" data-c="' + esc(c) + '" aria-pressed="' + draft.cats.includes(c) + '">' + esc(c) + '</button>').join('') : '<span class="hint">未有分類，喺下面加第一個。</span>';
  $('#fKws').innerHTML = draft.kws.length ? draft.kws.map((k, i) => '<button type="button" class="kw" data-i="' + i + '" aria-label="移除 ' + esc(k) + '">' + esc(k) + ' ×</button>').join('') : '<span class="hint">未有關鍵字。</span>';
  $('#fImgs').innerHTML = draft.imgs.length ? thumbs(draft.imgs, true, true) : '<span class="hint">未有圖片。</span>';
}
$('#fImgs').onclick = e => { const b = e.target.closest('[data-rm]'); if (b){ draft.imgs.splice(+b.dataset.rm, 1); renderDraft(); } };
$('#fCats').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = b.dataset.c; draft.cats = draft.cats.includes(c) ? draft.cats.filter(x => x !== c) : draft.cats.concat(c); renderDraft(); };
$('#fKws').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; draft.kws.splice(+b.dataset.i, 1); renderDraft(); };
function addDraftCat(){ const v = $('#fNewCat').value.trim(); if (!v) return; if (!draft.cats.includes(v)) draft.cats.push(v); $('#fNewCat').value = ''; renderDraft(); }
function addDraftKw(){ const vs = $('#fNewKw').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean); for (const v of vs) if (!draft.kws.some(k => k.toLowerCase() === v.toLowerCase())) draft.kws.push(v); $('#fNewKw').value = ''; renderDraft(); }
$('#fAddCat').onclick = addDraftCat; $('#fAddKw').onclick = addDraftKw;
$('#fNewCat').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addDraftCat(); } };
$('#fNewKw').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addDraftKw(); } };
$('#fCancel').onclick = () => $('#editDlg').close();
$('#fSave').onclick = async () => {
  addDraftCat(); addDraftKw();
  const parsed = parseInput($('#fUrl').value.trim());
  draft.author = parsed.author || (parsed.url && parsed.url !== draft.url ? '' : draft.author); draft.url = parsed.url;
  draft.text = $('#fText').value.trim(); draft.note = $('#fNote').value.trim();
  if (!draft.url && !draft.text && !draft.imgs.length){ toast('連結、內容、圖片最少要有一樣'); return; }
  const fresh = draft.cats.filter(c => !state.metaCats.includes(c));
  $('#fSave').disabled = true;
  const ok = await savePost(draft);
  if (ok && fresh.length) await saveCats(state.metaCats.concat(fresh));
  $('#fSave').disabled = false;
  if (ok){ $('#editDlg').close(); toast('儲存咗'); }
};

/* ---------- category manager ---------- */
function openCats(){ renderCats(); $('#cNew').value = ''; $('#catDlg').showModal(); }
function renderCats(){
  const cats = allCats();
  $('#catList').innerHTML = cats.length ? cats.map((c, i) => '<div class="catrow"><input type="text" id="cat-' + i + '" value="' + esc(c) + '" data-old="' + esc(c) + '" aria-label="分類名"><button type="button" class="btn" data-ren="' + i + '">改名</button><button type="button" class="btn danger" data-del="' + esc(c) + '">刪除</button></div>').join('') : '<span class="hint">未有分類。</span>';
}
async function rewriteCat(oldName, newName){
  let meta = allCats().filter(c => c !== oldName);
  if (newName && !meta.includes(newName)) meta.push(newName);
  for (const p of state.posts.filter(p => (p.cats || []).includes(oldName))){
    const cats = p.cats.filter(c => c !== oldName);
    if (newName && !cats.includes(newName)) cats.push(newName);
    await savePost(Object.assign({}, p, { cats }));
  }
  if (state.filter === 'c:' + oldName) state.filter = newName ? 'c:' + newName : 'all';
  await saveCats(meta); renderCats();
}
$('#catList').onclick = async e => {
  const r = e.target.closest('[data-ren]'), d = e.target.closest('[data-del]');
  if (r){ const inp = $('#cat-' + r.dataset.ren); const v = inp.value.trim(); if (!v || v === inp.dataset.old) return; r.disabled = true; await rewriteCat(inp.dataset.old, v); toast('改咗名'); }
  else if (d){
    if (d.dataset.sure){ d.disabled = true; await rewriteCat(d.dataset.del, ''); toast('刪除咗分類，收藏仲喺度'); }
    else { d.dataset.sure = '1'; d.textContent = '確定？'; }
  }
};
$('#cAdd').onclick = async () => { const v = $('#cNew').value.trim(); if (!v) return; const cats = allCats(); if (!cats.includes(v)){ cats.push(v); await saveCats(cats); } $('#cNew').value = ''; renderCats(); };
$('#cDone').onclick = () => $('#catDlg').close();

/* ---------- backup ---------- */
$('#bExport').onclick = async () => {
  const d = new Date(); const name = 'threads-shelf-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
  const blob = new Blob([JSON.stringify({ app: 'threads-shelf', version: 1, cats: allCats(), posts: state.posts })], { type: 'application/json' });
  try {
    const f = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f], title: 'Threads 收藏簿備份' }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('備份檔下載咗');
};
$('#bImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.posts)) throw new Error('format');
    const have = new Set(state.posts.map(p => p.id)); let n = 0;
    for (const p of d.posts){ if (!p || !p.id || have.has(p.id)) continue; if (await savePost(Object.assign({ created: Date.now() }, p))) n++; }
    const cats = allCats(); for (const c of (d.cats || [])) if (!cats.includes(c)) cats.push(c);
    await saveCats(cats);
    toast('匯入咗 ' + n + ' 個收藏');
  } catch(err){ toast('呢個唔係收藏簿嘅備份檔'); }
};
$('#bDone').onclick = () => $('#backupDlg').close();

for (const d of document.querySelectorAll('dialog')) if (d.id !== 'viewDlg') d.addEventListener('click', e => { if (e.target === d) d.close(); });

/* ---------- install as app ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').hidden = true; toast('安裝好喇，喺主畫面開就得'); });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; $('#installBtn').hidden = true; };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

render();
init();
</script>
</body>
</html>
